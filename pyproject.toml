[project]
name = "motion-jepa-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argparse>=1.4.0",
    "lightning>=2.6.5",
    "matplotlib>=3.11.0",
    "omegaconf>=2.3.1",
    "polars>=1.42.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.11.0",
    "tensorboard>=2.21.0",
    "torch>=2.12.1",
    "umap-learn>=0.5.9.post2",
    "zarr>=3.2.1",
]

[project.scripts]
preprocess = "motion_jepa.preprocess:main"
train = "motion_jepa.train:main"
evaluate = "motion_jepa.evaluation.cli:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motion_jepa*"]
