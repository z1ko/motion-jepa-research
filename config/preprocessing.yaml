# How to resample frames
resampling:
  target_hz: 100.0

# All metadata columns in order
metadata:
  - subject_height_m
  - subject_mass_kg

# Channels of each DoF in order
dofs_channels:
  raw: ""
  vel: "_vel"
  acc: "_acc"
  tau: "_tau"

# List of all DoF names in order
dofs:
  - pelvis_tilt           # 0
  - pelvis_list           # 1
  - pelvis_rotation       # 2
  - pelvis_tx             # 3
  - pelvis_ty             # 4
  - pelvis_tz             # 5
  - hip_flexion_r         # 6
  - hip_adduction_r       # 7
  - hip_rotation_r        # 8
  - knee_angle_r          # 9
  - ankle_angle_r         # 10
  - subtalar_angle_r      # 11
  - mtp_angle_r           # 12
  - hip_flexion_l         # 13
  - hip_adduction_l       # 14
  - hip_rotation_l        # 15
  - knee_angle_l          # 16
  - ankle_angle_l         # 17
  - subtalar_angle_l      # 18
  - mtp_angle_l           # 19
  - lumbar_bending        # 20
  - lumbar_extension      # 21
  - lumbar_twist          # 22
  - thorax_bending        # 23
  - thorax_extension      # 24
  - thorax_twist          # 25
  - head_bending          # 26
  - head_extension        # 27
  - head_twist            # 28
  - scapula_abduction_r   # 29
  - scapula_elevation_r   # 30
  - scapula_upward_rot_r  # 31
  - scapula_abduction_l   # 32
  - scapula_elevation_l   # 33
  - scapula_upward_rot_l  # 34
  - shoulder_r_x          # 35
  - shoulder_r_y          # 36
  - shoulder_r_z          # 37
  - shoulder_l_x          # 38
  - shoulder_l_y          # 39
  - shoulder_l_z          # 40
  - elbow_flexion_r       # 41
  - elbow_flexion_l       # 42
  - pro_sup_r             # 43
  - pro_sup_l             # 44
  - wrist_flexion_r       # 45
  - wrist_deviation_r     # 46
  - wrist_flexion_l       # 47
  - wrist_deviation_l     # 48

# The default type is angular, only those 3 are translations
dof_types:
  pelvis_tx: translation
  pelvis_ty: translation
  pelvis_tz: translation

bones_scale_channels:
  x: "_scale_x"
  y: "_scale_y"
  z: "_scale_z"

bones_grf_channels:
  x: "_grf_x"
  y: "_grf_y"
  z: "_grf_z"

# List of all bone names in order
bones:
  - pelvis                # 0
  - femur_r               # 1
  - tibia_r               # 2
  - talus_r               # 3
  - calcn_r               # 4
  - toes_r                # 5
  - femur_l               # 6
  - tibia_l               # 7
  - talus_l               # 8
  - calcn_l               # 9
  - toes_l                # 10
  - lumbar_body           # 11
  - thorax                # 12
  - head                  # 13
  - scapula_r             # 14
  - humerus_r             # 15
  - ulna_r                # 16
  - radius_r              # 17
  - hand_r                # 18
  - scapula_l             # 19
  - humerus_l             # 20
  - ulna_l                # 21
  - radius_l              # 22
  - hand_l                # 23