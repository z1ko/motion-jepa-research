
data:
  root: "data/processed/motion"
  window_size: 200
  min_valid_frames: 200
  stride: 50

training:
  batch_size: 256
  epochs: 100
  seed: 42
  groups:
    pelvis:                 [0, 1, 2, 3, 4, 5]
    right_upper_leg:        [6, 7, 8, 9]
    right_foot:             [10, 11, 12]
    left_upper_leg:         [13, 14, 15, 16]
    left_foot:              [17, 18, 19]
    spine:                  [20, 21, 22, 23, 24, 25]
    head:                   [26, 27, 28]
    right_shoulder_complex: [29, 30, 31, 35, 36, 37]
    right_lower_arm:        [41, 43, 45, 46]
    left_shoulder_complex:  [32, 33, 34, 38, 39, 40]
    left_lower_arm:         [42, 44, 47, 48]

architecture:
  embed_dim: 256
  segment_size: 20
  channels: 4
  encoder:
    mlp_ratio: 4.0
    dropout: 0.15
    heads: 8
    depth: 4
  predictor:
    inner_dim: 256
    mlp_ratio: 4.0
    dropout: 0.15
    heads: 8
    depth: 2

optim:
  loss: centered_ce  # or smooth_l1, for the old-loss comparison run on this same architecture
  ema_momentum: 0.9999
  learning_rate: 0.001
  weight_decay: 0.1
  center_momentum: 0.9
  tau_predict: 0.1
  tau_target: 0.1

masking:
  mamp_target_fraction: 0.7
  mamp_temperature: 1.2