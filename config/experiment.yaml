
data:
  root: "data/processed/motion"

training:
  batch_size: 100
  segment_size: 40
  masks_per_sample: 4
  epochs: 100
  seed: 42
  groups:
    pelvis:                 [0, 1, 2, 3, 4, 5]
    right_upper_leg:        [6, 7, 8, 9]
    right_foot:             [10, 11, 12]
    left_upper_leg:         [13, 14, 15, 16]
    left_foot:              [17, 18, 19]
    spine:                  [20, 21, 22, 23, 24, 25]
    head:                   [26, 27, 28]
    right_shoulder_complex: [29, 30, 31, 35, 36, 37]
    right_lower_arm:        [41, 43, 45, 46]
    left_shoulder_complex:  [32, 33, 34, 38, 39, 40]
    left_lower_arm:         [42, 44, 47, 48]

architecture:
  embed_dim: 256
  encoder:
    mlp_ratio: 4.0
    dropout: 0.0
    heads: 4
    depth: 8
  predictor:
    mlp_ratio: 4.0
    dropout: 0.0
    heads: 4
    depth: 8

optimization:
  ema_momentum: 0.996
  learning_rate: 0.0005
  weight_decay: 0.05